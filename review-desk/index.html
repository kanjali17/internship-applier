<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Answer Review Desk</title>
<style>
  :root { --bg:#f7f6f3; --card:#fff; --ink:#1d1d1b; --muted:#6b6a66; --line:#e3e1dc; --accent:#2f5bd3; --good:#1f7a4d; --bad:#b3401f; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161615; --card:#1f1f1e; --ink:#ecebe7; --muted:#a09f9a; --line:#33322f; --accent:#7d9bff; --good:#5cc592; --bad:#ff8a66; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { position:sticky; top:0; background:var(--bg); border-bottom:1px solid var(--line); padding:14px 16px; display:flex; gap:12px; flex-wrap:wrap; align-items:center; z-index:1; }
  h1 { font-size:18px; margin:0 auto 0 0; }
  button, label.btn { font:inherit; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:8px; padding:6px 12px; cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  main { max-width:820px; margin:0 auto; padding:16px; }
  .empty { color:var(--muted); text-align:center; padding:48px 0; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin:0 0 16px; }
  .meta { color:var(--muted); font-size:13px; margin-bottom:6px; }
  .q { font-weight:600; margin:0 0 10px; }
  .a { white-space:pre-wrap; margin:0 0 12px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:8px; }
  .stars button { width:36px; padding:6px 0; }
  .stars button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .approve.on { background:var(--good); color:#fff; border-color:var(--good); }
  .rewrite.on { background:var(--bad); color:#fff; border-color:var(--bad); }
  textarea { width:100%; min-height:56px; font:inherit; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:8px; margin-top:8px; }
  .count { color:var(--muted); font-size:13px; }
  input[type=file] { display:none; }
</style>
</head>
<body>
<header>
  <h1>Answer Review Desk</h1>
  <span class="count" id="count"></span>
  <label class="btn">Load drafts.json<input type="file" id="file" accept=".json"></label>
  <button class="primary" id="export">Export grades</button>
</header>
<main id="list"><p class="empty">Run <code>python3 autopilot.py review export</code>, then load <code>review-desk/drafts.json</code> here.</p></main>
<script>
  // Grades are kept in this browser only until you export them. Nothing leaves your computer.
  const KEY = 'review-desk-grades';
  let items = [], grades = {};
  try { grades = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { grades = {}; }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(grades)); } catch (e) {} render(); };
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  function render() {
    const el = document.getElementById('list');
    const done = items.filter(i => grades[i.id]?.decision).length;
    document.getElementById('count').textContent = items.length ? `${done} of ${items.length} graded` : '';
    if (!items.length) return;
    el.innerHTML = items.map(i => {
      const g = grades[i.id] || {};
      const stars = [1,2,3,4,5].map(n => `<button class="${g.score === n ? 'on' : ''}" data-id="${esc(i.id)}" data-score="${n}">${n}</button>`).join('');
      return `<article class="card">
        <div class="meta">${esc(i.company)} · ${esc(i.role)}${i.story ? ' · story: ' + esc(i.story) : ''}</div>
        <p class="q">${esc(i.question)}</p>
        <p class="a">${esc(i.answer)}</p>
        ${i.note ? `<div class="meta">Note from Claude: ${esc(i.note)}</div>` : ''}
        <div class="row"><span class="stars">${stars}</span>
          <button class="approve ${g.decision === 'approve' ? 'on' : ''}" data-id="${esc(i.id)}" data-decision="approve">Approve</button>
          <button class="rewrite ${g.decision === 'rewrite' ? 'on' : ''}" data-id="${esc(i.id)}" data-decision="rewrite">Rewrite</button></div>
        <textarea data-id="${esc(i.id)}" placeholder="What should change? (optional)">${esc(g.note || '')}</textarea>
      </article>`;
    }).join('');
  }

  document.getElementById('list').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    const g = grades[b.dataset.id] = grades[b.dataset.id] || {};
    if (b.dataset.score) g.score = +b.dataset.score;
    if (b.dataset.decision) g.decision = b.dataset.decision;
    g.updatedAt = new Date().toISOString(); save();
  });
  document.getElementById('list').addEventListener('change', e => {
    if (e.target.tagName !== 'TEXTAREA') return;
    const g = grades[e.target.dataset.id] = grades[e.target.dataset.id] || {};
    g.note = e.target.value; g.updatedAt = new Date().toISOString(); save();
  });
  document.getElementById('file').addEventListener('change', async e => {
    const f = e.target.files[0]; if (!f) return;
    try { items = JSON.parse(await f.text()).items || []; render(); } catch (err) { alert('That file is not a drafts.json export.'); }
  });
  document.getElementById('export').addEventListener('click', () => {
    const ids = new Set(items.map(i => i.id));
    const out = Object.fromEntries(Object.entries(grades).filter(([k, v]) => ids.has(k) && v.decision));
    const blob = new Blob([JSON.stringify({ grades: out }, null, 2)], { type: 'application/json' });
    const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: 'grades.json' });
    a.click(); URL.revokeObjectURL(a.href);
  });
</script>
</body>
</html>
